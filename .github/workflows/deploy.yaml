name: Deploy drivestate-AI-Agent

on:
    push:
        branches:
            - main
            - ai-agent
jobs:
    deploy:
        name: Deploy Agent

        runs-on: ubuntu-latest

        env:
            AWS_REGION: us-east-1
            STAGE: dev
            SERVERLESS_ACCESS_KEY: ${{secrets.SERVERLESS_ACCESS_KEY}}
        
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                python-version: "3.13"
            - name: Set up NodeJs
              uses: actions/setup-node@v4
             
            - name: Serverless Deploy
              run: |
                
                # export STAGE=dev
                                
                export TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
                

                

                #Export Estatengine AWS credentials
                export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY }}
                export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
                export AWS_REGION=${{ env.AWS_REGION }}
                
                cd src
                chmod +x package_lambdas.sh
                ./package_lambdas.sh
                cd ..
                npm i -g serverless 
                
                
                sls login 
                npm install serverless-appsync-plugin ---debug
                sls package --stage $STAGE --region $AWS_REGION
                sls deploy --stage $STAGE --region $AWS_REGION