openapi: 3.0.0
info:
  title: Web Search Payload
  version: 1.0.0
  description: Schema for web search payload used in AI agent interactions.
paths:
  /web_search:
    post:
      summary: Perform a web search
      operationId: webSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The search query to perform.
              required:
                - query
      responses:
        '200':
          description: Successful search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  body:
                    type: object
                    properties:
                      query:
                        type: string
                        description: The original search query.
                      follow_up_questions:
                        type: array
                        items:
                          type: string
                        description: List of follow-up questions based on the search results.
                      answer:
                        type: array
                        items:
                          type: string
                        description: List of answers derived from the search results.
                      images:
                        type: array
                        items:
                          type: string
                        description: List of image URLs related to the search results.
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              description: Title of the search result.
                            url:
                              type: string
                              format: uri
                              description: URL of the search result.
                            content:
                              type: string
                              description: Snippet or summary of the search result.
                            score:
                              type: number
                              format: float
                              description: Relevance score of the search result.
        '400':
          description: Bad request, invalid input
        '500':
          description: Internal server error, failed to process the search request             